name: RevenueCat sandbox branch validation

on:
  push:
    branches:
      - feature/revenuecat-sandbox-paywall
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sandbox branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies and refresh lockfile
        run: npm install --no-audit --no-fund
      - name: Commit updated dependency lockfile to sandbox branch
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: synchronize RevenueCat dependency lockfile"
            git push
          fi
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Build app
        run: npm run build
